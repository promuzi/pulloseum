<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05070d">
<title>풀로세움</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="풀로세움">
<link rel="apple-touch-icon" href="../assets/v2/app/apple-touch-icon.png">
<script>
// 카카오톡 안 브라우저(위아래 창이 남고 전체 화면이 안 됨)로 열면 바깥 브라우저(크롬 · 사파리)로 다시 엶 — 2026-10-17
(function () { try { var ua = navigator.userAgent || ''; if (/KAKAOTALK/i.test(ua) && !/PulloseumApp/.test(ua)) location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(location.href); } catch (e) {} })();
</script>
<style>
@font-face{font-family:Pretendard;font-weight:600;font-display:block;src:url('../assets/fonts/sub/Pretendard-SemiBold.woff2') format('woff2');}
@font-face{font-family:Pretendard;font-weight:700;font-display:block;src:url('../assets/fonts/sub/Pretendard-Bold.woff2') format('woff2');}
@font-face{font-family:Pretendard;font-weight:800;font-display:block;src:url('../assets/fonts/sub/Pretendard-ExtraBold.woff2') format('woff2');}
@font-face{font-family:Pretendard;font-weight:900;font-display:block;src:url('../assets/fonts/sub/Pretendard-Black.woff2') format('woff2');}
html,body{margin:0;height:100%;background:#1a1420;overflow:hidden;touch-action:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;touch-action:none;}
/* 2026-10-17 touch-action:none — 폰에서 끌기를 브라우저가 스크롤로 가로채 끊김(식물 관리 카드 끌기 · 스마트팜 서랍 — 사용자 "끊기듯" · "조금 흔들리다가 말아") */
#screen{display:block;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;}
</style>
</head>
<body>
<div id="stage"><canvas id="screen"></canvas></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
