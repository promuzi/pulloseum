<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>식물 컨셉</title>
<style>
@font-face { font-family: P; src: url(/assets/fonts/sub/Pretendard-SemiBold.woff2) format('woff2'); font-weight: 600; }
@font-face { font-family: P; src: url(/assets/fonts/sub/Pretendard-ExtraBold.woff2) format('woff2'); font-weight: 800; }
body { margin: 0; background: #070b14; font-family: P, sans-serif; font-weight: 600; color: #e6f1ff; }
.sheet { width: 800px; padding: 26px 20px 24px; box-sizing: border-box; background: #0b1424; margin-bottom: 12px; }
h1 { margin: 0 0 14px 4px; font-size: 30px; font-weight: 800; color: #ffd890; }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.card { background: #102038; border: 1px solid #22456e; border-radius: 10px; padding: 10px 10px 12px; }
.pic { display: block; margin: 0 auto 6px; width: 192px; height: 240px; image-rendering: pixelated; }
.nm { font-size: 20px; font-weight: 800; color: #fff; }
.tags { margin: 4px 0 6px; }
.el, .tg { display: inline-block; border-radius: 6px; padding: 0 6px; font-size: 13px; font-weight: 800; margin-right: 3px; }
.el { color: #0b1424; } .tg { border: 1px solid #3a6a9a; color: #b8dcfa; }
.cc { font-size: 16px; line-height: 1.4; color: #d8ecff; }
</style></head><body><div id="root"></div>
<script type="module">
import { SPECIES, JONG, FORMS } from '/v2/src/game/catalog.js';
import { ELEMENT } from '/v2/src/art/palette.js';
import { CONCEPT, pic, ready } from './concepts.js';


const esc = t => String(t ?? '').replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
await ready;
const EL_ORDER = Object.keys(ELEMENT), TY = ['flower', 'vine', 'cactus', 'mushroom'];
const keys = Object.keys(SPECIES).sort((a, b) => EL_ORDER.indexOf(SPECIES[a].el) - EL_ORDER.indexOf(SPECIES[b].el) || TY.indexOf(SPECIES[a].type) - TY.indexOf(SPECIES[b].type));
const PER = 15, sheets = [];
for (let i = 0; i < keys.length; i += PER) {
  const part = keys.slice(i, i + PER).map(k => {
    const sp = SPECIES[k], E = ELEMENT[sp.el] || {}, F = sp.form && FORMS[sp.form];
    return `<div class="card"><img class="pic" src="${pic(k)}"><div class="nm">${esc(sp.name)}</div>
      <div class="tags"><span class="el" style="background:${E.light || E.main}">${esc(E.name)}</span><span class="tg">${esc(JONG[sp.type])}</span>${F ? `<span class="tg" style="color:${F.light};border-color:${F.col}">태생 ${esc(F.name)}</span>` : ''}</div>
      <div class="cc">${esc(CONCEPT[k] || '')}</div></div>`;
  }).join('');
  const n = Math.ceil(keys.length / PER), t = n > 1 ? `식물 컨셉 (${i / PER + 1}/${n})` : '식물 컨셉';
  sheets.push(`<div class="sheet"><h1>${t}</h1><div class="grid">${part}</div></div>`);
}
document.getElementById('root').innerHTML = sheets.join('');
await Promise.all([...document.images].map(im => (im.complete ? 0 : new Promise(r => { im.onload = r; im.onerror = r; }))));
await document.fonts.ready;
window.__ready = sheets.length;
</script></body></html>
